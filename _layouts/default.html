<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.tldr | default: site.description | strip_html | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="logo">&gt;_</span> {{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Today</a>
        <a href="{{ '/categories/' | relative_url }}">Categories</a>
        <a href="{{ '/security-now/' | relative_url }}">Security Now</a>
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
        <a href="{{ '/feed.xml' | relative_url }}" title="RSS feed">RSS</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer wrap">
    Compiled daily by Claude from public sources. Every item links to its original source — check there before acting on anything.
  </footer>
  <script>window.CATS = {{ site.data.categories | jsonify }};</script>
  <script src="{{ '/assets/js/brief.js' | relative_url }}"></script>
</body>
</html>
