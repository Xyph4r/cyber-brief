<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'none'; frame-src 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
{% include meta.html %}
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% feed_meta %}
  {%- if page.item_id %}
  <script src="{{ '/assets/js/item.js' | relative_url }}" data-target="{{ page.post_url | relative_url }}#{{ page.item_id }}"></script>
  {%- endif %}
</head>
<body data-items="{{ '/i/' | relative_url }}">
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ '/' | relative_url }}"><span class="logo">&gt;_</span> {{ site.title }}</a>
      <nav class="site-nav">
        <a href="{{ '/' | relative_url }}">Today</a>
        <a href="{{ '/categories/' | relative_url }}">Categories</a>
        <a href="{{ '/security-now/' | relative_url }}">Security Now</a>
        <a href="{{ '/archive/' | relative_url }}">Archive</a>
        <a href="{{ '/feed.xml' | relative_url }}" title="RSS feed">RSS</a>
      </nav>
    </div>
  </header>
  <main class="wrap">
    {{ content }}
  </main>
  <footer class="site-footer wrap">
    Compiled daily by Claude from public sources. Every item links to its original source — check there before acting on anything.
  </footer>
  <script src="{{ '/assets/js/categories.js' | relative_url }}"></script>
  <script src="{{ '/assets/js/brief.js' | relative_url }}"></script>
</body>
</html>
